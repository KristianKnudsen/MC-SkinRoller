plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

def fabricApiVersions = [
	'1.21'   : '0.102.0+1.21',
	'1.21.1' : '0.116.17+1.21.1',
	'1.21.2' : '0.106.1+1.21.2',
	'1.21.3' : '0.114.1+1.21.3',
	'1.21.4' : '0.119.4+1.21.4',
	'1.21.5' : '0.128.2+1.21.5',
	'1.21.6' : '0.128.2+1.21.6',
	'1.21.7' : '0.129.0+1.21.7',
	'1.21.8' : '0.136.1+1.21.8',
	'1.21.9' : '0.134.1+1.21.9',
	'1.21.10': '0.138.4+1.21.10',
	'1.21.11': '0.141.6+1.21.11',
]

def minecraftVersion = findProperty('mc') ?: fabricApiVersions.keySet().last()
def fabricApiVersion = fabricApiVersions[minecraftVersion]
if (fabricApiVersion == null) {
	throw new GradleException("Unsupported Minecraft version ${minecraftVersion}. Supported: ${fabricApiVersions.keySet().join(', ')}")
}
def pixelApi = minecraftVersion in ['1.21', '1.21.1'] ? 'legacy' : 'modern'

version = "${mod_version}+mc${minecraftVersion}-fabricapi${fabricApiVersion.split('\\+')[0]}"

base {
	archivesName = 'mc-skinroller'
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDir "src/compat/${pixelApi}/java"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = [version: project.version, minecraft_version: minecraftVersion]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

def buildAll = tasks.register('buildAll') {
	group = 'build'
	description = 'Builds a jar for every supported Minecraft version.'
}
def previous = null
fabricApiVersions.keySet().each { mc ->
	def runAfter = previous
	def versionBuild = tasks.register("build_${mc.replace('.', '_')}", GradleBuild) {
		buildName = "skinroller-${mc}"
		startParameter.projectProperties = [mc: mc]
		tasks = ['build']
		if (runAfter != null) {
			mustRunAfter runAfter
		}
	}
	buildAll.configure { dependsOn versionBuild }
	previous = versionBuild
}
